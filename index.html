        auth.onAuthStateChanged(async (user) => {

            if (user) {
                console.log('用户信息:', user.uid, user.email);
                // 已登录，加载用户数据

        function checkCDNResources() {
            var resources = [
                { name: 'Font Awesome', check: function() { return typeof FontAwesome !== 'undefined' || document.querySelector('.fa-user'); } },
                { name: 'XLSX', check: function() { return typeof XLSX !== 'undefined'; } },
                { name: 'html2canvas', check: function() { return typeof html2canvas !== 'undefined'; } },
                { name: 'jsPDF', check: function() { return typeof jspdf !== 'undefined'; } },
                { name: 'docx', check: function() { return typeof docx !== 'undefined'; } }
            ];
            
            var failedResources = [];
            resources.forEach(function(res) {
                try {
                    if (!res.check()) {
                        failedResources.push(res.name);
                        console.error('CDN资源加载失败:', res.name);
                    }
                } catch (e) {
                    failedResources.push(res.name);
                    console.error('CDN资源检查错误:', res.name, e);
                }
            });
            
            if (failedResources.length > 0) {
                console.warn('以下CDN资源可能未正确加载:', failedResources.join(', '));
                var warningDiv = document.createElement('div');
                warningDiv.style.cssText = 'position: fixed; top: 10px; right: 10px; background: #fef3c7; border: 2px solid #f59e0b; padding: 15px; border-radius: 8px; z-index: 9999; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);';
                warningDiv.innerHTML = '<div style="font-weight: bold; color: #92400e; margin-bottom: 8px;">⚠️ CDN资源加载警告</div><div style="color: #92400e; font-size: 14px;">以下资源可能未正确加载：<br><strong>' + failedResources.join(', ') + '</strong><br><br>建议：<br>1. 检查网络连接<br>2. 刷新页面<br>3. 清除浏览器缓存<br>4. 按F12查看控制台错误</div><button onclick="this.parentElement.remove()" style="margin-top: 10px; padding: 5px 15px; background: #f59e0b; border: none; border-radius: 4px; color: white; cursor: pointer;">关闭</button>';
                document.body.appendChild(warningDiv);
            } else {
                console.log('✅ 所有CDN资源加载成功');
            }
        }

    } catch (error) {

        if (error.code === 'auth/user-not-found') errorMsg = '用户不存在';
        else if (error.code === 'auth/wrong-password') errorMsg = '密码错误';

        else if (error.code === 'auth/invalid-credential') errorMsg = '邮箱或密码错误';
        else errorMsg = '登录失败: ' + error.message;

        showToast(errorMsg, 'error');
    }
}

        function addTeacher(e) {
            e.preventDefault();
            var form = e.target;
            var username = form.username.value.trim();

            if (users.find(u => u.username === username)) {
                showToast('该账号已存在', 'error');
                return;
            }

            var newTeacherId = teachers.length + 1;
            var accountType = form.accountType.value;

            var newTeacher = {
                id: newTeacherId,
                name: form.name.value,
                email: form.email.value,
                username: username,
                accountType: accountType,
                students: 0,
                rate: 90,
                createdAt: new Date().toISOString().split('T')[0]
            };

            teachers.push(newTeacher);

            users.push({
                id: 't' + newTeacherId,
                username: username,
                password: form.password.value,
                role: accountType === '系统管理员' ? 'manager' : 'teacher',
                name: form.name.value,
                teacherId: newTeacherId,
                accountType: accountType
            });

            form.reset();
            updateTeacherStats();
            saveData();
            renderPage();
            showToast('添加成功');
        }

        // ==================== Excel导入功能 ====================

        function handleExcelImport(input) {
            var file = input.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = XLSX.read(data, {type: 'array'});
                    var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    var jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if (jsonData.length > 0) {
                        var successCount = 0;
                        jsonData.forEach(row => {
                            var teacherName = row['中期顾问'] || row['负责老师'] || row['老师'] || '张老师';
                            var teacher = teachers.find(t => t.name === teacherName) || teachers[0];
                            
                            var newStudent = {
                                id: students.length + 1,
                                name: row['姓名'] || row['学生姓名'] || '未命名',
                                type: row['类型'] || '本科生',
                                school: row['学校'] || '待补充',
                                major: row['专业'] || '待补充',
                                gpa: row['GPA'] || row['gpa'] || '0.00',
                                teacherId: teacher.id,
                                teacherName: teacher.name,
                                status: '规划中',
                                targetDegree: row['目标学位'] || '硕士',
                                contractType: row['合同类型'] || '普通合同',
                                createdAt: new Date().toISOString().split('T')[0],
                                updatedAt: new Date().toISOString().split('T')[0],
                                details: {
                                    school: row['学校'] || '',
                                    major: row['专业'] || '',
                                    gpa: row['GPA'] || '',
                                    ielts: row['雅思'] || '',
                                    toefl: row['托福'] || '',
                                    gre: row['GRE'] || '',
                                    gmat: row['GMAT'] || '',
                                    competition: row['竞赛'] || '',
                                    research: row['科研'] || '',
                                    internship: row['实习'] || '',
                                    visit: row['访学'] || '',
                                    applicationSeason: '',
                                    earlyConsultant: '',
                                    lateConsultant: ''
                                },
                                planning: {
                                    courses: [],
                                    timeline: [],
                                    networkApplyStart: '',
                                    networkApplyEnd: '',
                                    plans: [],
                                    selectedItems: [],
                                    customFields: [],
                                    screenshots: [],
                                    serviceStartDate: row['服务开始时间'] || '',
                                    enrollmentDate: '',
                                    timePeriods: [],
                                    images: []
                                }
                            };
                            students.push(newStudent);
                            successCount++;
                        });
                        
                        updateTeacherStats();
                        saveData();
                        renderPage();
                        showToast('成功导入 ' + successCount + ' 名学生');
                    } else {
                        showToast('Excel文件为空', 'error');
                    }
                } catch (err) {
                    showToast('导入失败，请检查文件格式', 'error');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
            input.value = '';
        }

        function exportToExcel() {
            var exportData = students.map(s => ({
                '姓名': s.name,
                '类型': s.type,
                '学校': s.school,
                '专业': s.major,
                'GPA': s.gpa,
                '中期顾问': s.teacherName,
                '状态': s.status,
                '目标学位': s.targetDegree,
                '合同类型': s.contractType,
                '创建日期': s.createdAt
            }));

            var wb = XLSX.utils.book_new();
            var ws = XLSX.utils.json_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws, "学生列表");
            XLSX.writeFile(wb, "学生列表_" + new Date().toISOString().slice(0,10) + ".xlsx");
            showToast('Excel导出成功');
        }

        // ==================== 多选功能 ====================

        function toggleSelectAll(checkbox) {
            var filteredStudents = students.filter(s => {
                var matchTeacher = currentTeacherFilter === 'all' || s.teacherId == currentTeacherFilter;
                var matchStatus = currentStatusFilter === 'all' || s.status === currentStatusFilter;
                var matchSearch = !currentSearchKeyword || s.name.toLowerCase().includes(currentSearchKeyword.toLowerCase());
                return matchTeacher && matchStatus && matchSearch;
            });

            if (checkbox.checked) {
                selectedStudents = filteredStudents.map(s => s.id);
            } else {
                selectedStudents = [];
            }
            renderPage();
        }

        function toggleSelectStudent(id) {
            var index = selectedStudents.indexOf(id);
            if (index > -1) {
                selectedStudents.splice(index, 1);
            } else {
                selectedStudents.push(id);
            }
            renderPage();
        }

        function openBatchAssign() {
            if (selectedStudents.length === 0) {
                showToast('请先选择学生', 'error');
                return;
            }
            document.getElementById('selectedCount').textContent = selectedStudents.length;
            var select = document.getElementById('batchAssignTeacher');
            select.innerHTML = '<option value="">选择老师</option>';
            teachers.filter(t => t.accountType === '中期老师').forEach(t => {
                select.innerHTML += '<option value="' + t.id + '">' + t.name + '</option>';
            });
            document.getElementById('batchAssignModal').classList.remove('hidden');
        }

        function closeBatchAssign() {
            document.getElementById('batchAssignModal').classList.add('hidden');
        }

        function confirmBatchAssign() {
            var teacherId = parseInt(document.getElementById('batchAssignTeacher').value);
            if (!teacherId) {
                showToast('请选择老师', 'error');
                return;
            }

            var teacher = teachers.find(t => t.id === teacherId);
            var count = 0;

            selectedStudents.forEach(id => {
                var s = students.find(st => st.id === id);
                if (s) {
                    s.teacherId = teacherId;
                    s.teacherName = teacher.name;
                    count++;
                }
            });

            updateTeacherStats();
            saveData();
            selectedStudents = [];
            closeBatchAssign();
            renderPage();
            showToast('成功分配 ' + count + ' 名学生给 ' + teacher.name);
        }

        function returnStudent(studentId) {
            var s = students.find(st => st.id === studentId);
            if (!s) return;

            if (s.teacherId !== currentUser.teacherId) {
                showToast('您没有权限退回此学生', 'error');
                return;
            }

            if (!confirm('确定要将学生 "' + s.name + '" 退回给管理者吗？退回后学生状态将更新为"已退回"。')) {
                return;

            s.status = '已退回';
            s.teacherId = null;
            s.teacherName = '';
            s.updatedAt = new Date().toISOString().split('T')[0];

        function handleExportImages(event) {
            var files = Array.from(event.target.files);
            files.forEach(function(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    tempExportImages.push(e.target.result);
                    renderExportImages();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderExportImages() {
            var container = document.getElementById('exportImagesList');
            if (!container) return;
            container.innerHTML = '';
            tempExportImages.forEach(function(img, idx) {
                container.innerHTML += '<div class="image-thumb"><img src="' + img + '"><button type="button" class="image-delete" onclick="removeExportImage(' + idx + ')"><i class="fas fa-times"></i></button></div>';
            });
        }

        function removeExportImage(idx) {
            tempExportImages.splice(idx, 1);
            renderExportImages();
        }

        // 导出 PNG（档案）
        function downloadExport() {
            if (typeof html2canvas === 'undefined') {
                showToast('图片生成库未加载，请检查网络连接', 'error');
                return;
            }
            
            var element = document.getElementById('export-content');
            showToast('正在生成图片...', 'success');

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(function(canvas) {
                try {
                    var link = document.createElement('a');
                    link.download = '学生档案-' + currentExportStudent.name + '-' + new Date().toISOString().slice(0,10) + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('✓ PNG图片已下载', 'success');
                } catch(err) {
                    showToast('✗ 导出失败: ' + err.message, 'error');
                    console.error(err);
                }
            }).catch(function(err) {
                showToast('✗ 导出失败: ' + err.message, 'error');
                console.error(err);
            });
        }

        // 导出 PDF（档案）
        function downloadExportPDF() {
            if (typeof window.jspdf === 'undefined') {
                showToast('PDF库未加载，请检查网络连接', 'error');
                return;
            }
            
            showToast('正在生成PDF...', 'success');
            var element = document.getElementById('export-content');
            
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(function(canvas) {
                try {
                    var pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
                    var imgData = canvas.toDataURL('image/png');
                    var imgWidth = 210;
                    var imgHeight = canvas.height * imgWidth / canvas.width;
                    
                    pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);

        function addPlanningCourseBlock() {
            var container = document.getElementById('planningCoursesContainer');
            var idx = container.children.length;
            container.insertAdjacentHTML('beforeend', renderPlanningCourseBlock(idx, null));
        }

        function removePlanningCourseBlock(idx) {
            var container = document.getElementById('planningCoursesContainer');
            var items = container.querySelectorAll('.planning-course-item');
            if (items[idx]) {
                items[idx].remove();
                delete courseImagesData[idx];
                // 重新索引
                var remaining = container.querySelectorAll('.planning-course-item');
                remaining.forEach(function(item, newIdx) {
                    item.setAttribute('data-idx', newIdx);
                    item.querySelector('.planning-course-title').textContent = '规划课 #' + (newIdx + 1);
                    item.querySelector('button[onclick^="removePlanningCourseBlock"]').setAttribute('onclick', 'removePlanningCourseBlock(' + newIdx + ')');
                    item.querySelector('.course-select').setAttribute('data-idx', newIdx);
                    item.querySelector('.course-content').setAttribute('data-idx', newIdx);
                    item.querySelector('.course-images').setAttribute('data-idx', newIdx);
                    item.querySelector('.course-images').setAttribute('onchange', 'handleCourseImages(event, ' + newIdx + ')');
                    item.querySelector('.uploaded-images-list').id = 'courseImages_' + newIdx;
                });
            }
        }

        function handleCourseImages(event, idx) {
            if (!courseImagesData[idx]) courseImagesData[idx] = [];
            var files = Array.from(event.target.files);
            files.forEach(function(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    courseImagesData[idx].push(e.target.result);
                    renderCourseImagesList(idx);
                };
                reader.readAsDataURL(file);
            });
        }

        function renderCourseImagesList(idx) {
            var container = document.getElementById('courseImages_' + idx);
            if (!container || !courseImagesData[idx]) return;
            container.innerHTML = courseImagesData[idx].map(function(img, imgIdx) {
                return '<div class="image-thumb"><img src="' + img + '"><button type="button" class="image-delete" onclick="removeCourseImage(' + idx + ', ' + imgIdx + ')"><i class="fas fa-times"></i></button></div>';
            }).join('');
        }

        function removeCourseImage(idx, imgIdx) {
            if (courseImagesData[idx]) {
                courseImagesData[idx].splice(imgIdx, 1);
                renderCourseImagesList(idx);
            }

        // 下载时间表 PDF
        function downloadTimelinePDF() {
            if (typeof window.jspdf === 'undefined') {
                showToast('PDF库未加载，请检查网络连接', 'error');
                return;
            }
            
            var element = document.getElementById('timeline-preview-content');
            showToast('正在生成PDF...');

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(function(canvas) {
                try {
                    var imgData = canvas.toDataURL('image/png');
                    var { jsPDF } = window.jspdf;
                    var pdf = new jsPDF('p', 'mm', 'a4');
                    
                    var imgWidth = 210;
                    var pageHeight = 297;
                    var imgHeight = canvas.height * imgWidth / canvas.width;
                    var heightLeft = imgHeight;
                    var position = 0;
                    
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                    
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    
                    pdf.save('时间表-' + currentExportStudent.name + '-' + new Date().toISOString().slice(0, 10) + '.pdf');
                    showToast('✓ PDF已下载', 'success');
                } catch(err) {
                    showToast('✗ PDF导出失败: ' + err.message, 'error');
                }
            }).catch(function(err) {
                showToast('✗ PDF导出失败，请重试', 'error');
            });
        }

        // ==================== 分页 ====================

        function renderPagination(total) {
            var pages = Math.ceil(total / pageSize);
            if (pages <= 1) return '';

            var html = '<div class="flex justify-center gap-2 p-4 border-t border-gray-100">';
            html += '<button onclick="changePage(' + (currentPageNum - 1) + ')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-sm ' + (currentPageNum === 1 ? 'opacity-50 cursor-not-allowed' : '') + '"><i class="fas fa-chevron-left"></i></button>';

            for (var i = 1; i <= pages; i++) {
                if (i === 1 || i === pages || (i >= currentPageNum - 1 && i <= currentPageNum + 1)) {
                    var activeClass = i === currentPageNum ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-300 hover:bg-gray-50';
                    html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 border rounded text-sm ' + activeClass + '">' + i + '</button>';
                } else if (i === currentPageNum - 2 || i === currentPageNum + 2) {
                    html += '<span class="px-2 text-gray-400">...</span>';
                }
            }

            html += '<button onclick="changePage(' + (currentPageNum + 1) + ')" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-sm ' + (currentPageNum === pages ? 'opacity-50 cursor-not-allowed' : '') + '"><i class="fas fa-chevron-right"></i></button>';
            html += '</div>';

            return html;
        }

            html += '<div class="h-1 bg-indigo-600 mb-6 rounded"></div>';

            html += '<div class="bg-white p-6 rounded-xl shadow-sm mb-6">';
            html += '<h2 class="section-title">选择月份</h2>';
            html += '<div class="flex gap-4">';
            html += '<input type="month" id="performanceMonth" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" value="' + new Date().toISOString().slice(0, 7) + '">';
            html += '<button onclick="loadPerformance()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">查看/编辑</button>';
            html += '</div></div>';

            html += '<div class="bg-white p-6 rounded-xl shadow-sm mb-6">';
            html += '<h2 class="section-title">绩效填写</h2>';
            html += '<form onsubmit="savePerformance(event)">';

            html += '<div class="mb-6">';
            html += '<label class="block text-sm font-medium text-gray-700 mb-2">阶段性绩效提成</label>';
            html += '<textarea name="stageReport" rows="4" placeholder="填写阶段性绩效提成情况..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>';
            html += '<p class="text-xs text-gray-500 mt-1">例如：某某同学规划课2次、某某同学选校报完成、某某同学录取报完成</p>';
            html += '</div>';

            html += '<div class="mb-6">';
            html += '<label class="block text-sm font-medium text-gray-700 mb-2">产品促签</label>';
            html += '<textarea name="productSign" rows="4" placeholder="填写产品促签情况..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>';
            html += '<p class="text-xs text-gray-500 mt-1">例如：某某顶峰计划，某某优选计划</p>';
            html += '</div>';

            html += '<div class="flex justify-center">';
            html += '<button type="submit" class="px-8 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:shadow-lg font-medium">保存并同步</button>';
            html += '</div>';
            html += '</form></div>';

            html += '<div class="bg-white p-6 rounded-xl shadow-sm">';
            html += '<h2 class="section-title">历史记录</h2>';
            var myPerformance = performanceData.filter(p => p.teacherId === currentUser.teacherId).slice(-5);
            if (myPerformance.length === 0) {
                html += '<p class="text-gray-500 text-center py-4">暂无绩效记录</p>';
            } else {
                html += '<div class="space-y-3">';
                myPerformance.forEach(p => {
                    html += '<div class="p-4 bg-gray-50 rounded-lg">';
                    html += '<div class="flex justify-between items-center mb-2">';
                    html += '<span class="font-bold text-indigo-600">' + p.month + '</span>';
                    html += '<span class="text-xs text-green-600"><i class="fas fa-check-circle mr-1"></i>已同步</span>';
                    html += '</div>';
                    html += '<div class="text-sm text-gray-600 mb-1"><span class="font-medium">阶段性绩效提成：</span>' + p.stageReport.substring(0, 50) + '...</div>';
                    html += '<div class="text-sm text-gray-600"><span class="font-medium">产品促签：</span>' + p.productSign.substring(0, 50) + '...</div>';
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div></div>';

            return html;
        }

        function savePerformance(e) {
            e.preventDefault();
            var form = e.target;
            var month = document.getElementById('performanceMonth').value;

            if (!month) {
                showToast('请选择月份', 'error');
                return;
            }

            var performance = {
                id: performanceData.length + 1,
                teacherId: currentUser.teacherId,
                teacherName: currentUser.name,
                month: month,
                stageReport: form.stageReport.value,
                productSign: form.productSign.value,
                createdAt: new Date().toISOString()
            };

            var existingIndex = performanceData.findIndex(p => p.teacherId === currentUser.teacherId && p.month === month);
            if (existingIndex > -1) {
                performanceData[existingIndex] = performance;
            } else {
                performanceData.push(performance);
            }

            form.reset();
            showToast('绩效已保存并同步到管理者界面');
            renderPage();
        }

        // ==================== 绩效查看（管理者视角）====================

        function renderManagerPerformance() {
            var html = '<div class="max-w-6xl mx-auto">';
            html += '<div class="flex items-center gap-3 mb-6">';
            html += '<i class="fas fa-chart-line text-3xl text-indigo-600"></i>';
            html += '<h1 class="text-2xl font-bold">老师绩效查看</h1>';
            html += '</div>';
            html += '<div class="h-1 bg-indigo-600 mb-6 rounded"></div>';

            html += '<div class="bg-white p-4 rounded-xl shadow-sm mb-6">';
            html += '<div class="flex items-center gap-4">';
            html += '<label class="font-medium text-gray-700">选择月份：</label>';
            html += '<input type="month" id="managerMonthFilter" onchange="filterPerformanceByMonth()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" value="' + new Date().toISOString().slice(0, 7) + '">';
            html += '</div></div>';

            html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
            teachers.filter(t => t.accountType === '中期老师').forEach(t => {
                var currentMonth = document.getElementById('managerMonthFilter')?.value || new Date().toISOString().slice(0, 7);
                var currentMonthPerf = performanceData.find(p => p.teacherId === t.id && p.month === currentMonth);

                html += '<div class="bg-white p-6 rounded-xl shadow-sm" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">';
                html += '<div class="flex justify-between items-start mb-4">';
                html += '<div><h3 class="text-xl font-bold">' + t.name + '</h3><p class="text-white/80 text-sm">' + t.email + '</p></div>';
                html += '<div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl font-bold">' + t.students + '</div>';
                html += '</div>';

                if (currentMonthPerf) {
                    html += '<div class="space-y-3 mb-4">';
                    html += '<div class="bg-white/10 p-3 rounded-lg">';
                    html += '<div class="text-xs text-white/70 mb-1">阶段性绩效提成</div>';
                    html += '<div class="text-sm">' + currentMonthPerf.stageReport + '</div>';
                    html += '</div>';
                    html += '<div class="bg-white/10 p-3 rounded-lg">';
                    html += '<div class="text-xs text-white/70 mb-1">产品促签</div>';
                    html += '<div class="text-sm">' + currentMonthPerf.productSign + '</div>';
                    html += '</div>';
                    html += '</div>';
                    html += '<div class="text-xs text-white/60 text-right"><i class="fas fa-check-circle mr-1"></i>已提交 ' + currentMonthPerf.month + '</div>';
                } else {
                    html += '<div class="text-center py-8 text-white/60">';
                    html += '<i class="fas fa-clock text-3xl mb-2"></i>';
                    html += '<p>该月份暂无绩效记录</p>';
                    html += '</div>';
                }
                html += '</div>';
            });
            html += '</div>';

            html += '<div class="mt-6 bg-white rounded-xl shadow-sm overflow-hidden">';
            html += '<h2 class="section-title mx-6 mt-6">绩效汇总</h2>';
            html += '<table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left font-medium">老师</th><th class="px-4 py-3 text-left font-medium">月份</th><th class="px-4 py-3 text-left font-medium">阶段性绩效提成</th><th class="px-4 py-3 text-left font-medium">产品促签</th><th class="px-4 py-3 text-left font-medium">提交时间</th></tr></thead><tbody class="divide-y divide-gray-100">';

            var allPerf = performanceData.slice().reverse();
            if (allPerf.length === 0) {
                html += '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">暂无绩效数据</td></tr>';
            } else {
                allPerf.forEach(p => {
                    html += '<tr class="hover:bg-gray-50">';
                    html += '<td class="px-4 py-3 font-medium">' + p.teacherName + '</td>';
                    html += '<td class="px-4 py-3">' + p.month + '</td>';
                    html += '<td class="px-4 py-3 text-gray-600">' + p.stageReport.substring(0, 30) + '...</td>';
                    html += '<td class="px-4 py-3 text-gray-600">' + p.productSign.substring(0, 30) + '...</td>';
                    html += '<td class="px-4 py-3 text-gray-400 text-xs">' + new Date(p.createdAt).toLocaleString() + '</td>';
                    html += '</tr>';
                });
            }
            html += '</tbody></table></div></div>';

            return html;
        }

        function filterPerformanceByMonth() {
            renderPage();
        }

        function loadPerformance() {
            var month = document.getElementById('performanceMonth').value;
            var existing = performanceData.find(p => p.teacherId === currentUser.teacherId && p.month === month);
            if (existing) {
                document.querySelector('textarea[name="stageReport"]').value = existing.stageReport;
                document.querySelector('textarea[name="productSign"]').value = existing.productSign;
                showToast('已加载 ' + month + ' 的绩效记录');
            } else {
                document.querySelector('textarea[name="stageReport"]').value = '';
                document.querySelector('textarea[name="productSign"]').value = '';
                showToast(month + ' 暂无记录，请填写');
            }
        }

        // ==================== 学生规划功能 ====================

        function studentPlanning(id) {
            openPlanning(id);
        }

        // ==================== 其他功能 ====================

        function addStudent(e) {
            e.preventDefault();
            var form = e.target;
            var teacherId = parseInt(form.teacherId.value);
            var teacher = teachers.find(t => t.id === teacherId);

            if (!teacher) {
                showToast('请选择分配老师', 'error');
                return;
            }

            var now = new Date().toISOString().split('T')[0];
            var newStudent = {
                id: students.length + 1,
                name: form.name.value,
                type: form.type.value,
                school: form.school.value || '待补充',
                major: form.major.value || '待补充',
                gpa: form.gpa.value || '0.00',
                teacherId: teacherId,
                teacherName: teacher.name,
                status: '规划中',
                targetDegree: form.targetDegree.value,
                contractType: form.contractType.value || '普通合同',
                createdAt: now,
                updatedAt: now,
                details: {
                    school: form.school.value || '',
                    major: form.major.value || '',
                    gpa: form.gpa.value || '',
                    ielts: '', toefl: '', cet4: '', cet6: '', gre: '', gmat: '',
                    competition: '', research: '', internship: '', visit: '',
                    applicationSeason: '', earlyConsultant: '', lateConsultant: ''
                },
                planning: {
                    courses: [],
                    timeline: [],
                    networkApplyStart: '',
                    networkApplyEnd: '',
                    plans: [],
                    selectedItems: [],
                    customFields: [],
                    screenshots: [],
                    serviceStartDate: '',
                    enrollmentDate: '',
                    timePeriods: [],
                    images: [],
                    otherContent: '',
                    newOrientContent: '',
                    newOrientExport: true
                }
            };

            students.push(newStudent);
            updateTeacherStats();
            saveData();
            form.reset();
            renderPage();
            showToast('成功添加学生');
        }

        function editStudent(id) {
            var s = students.find(st => st.id === id);
            if (!s) return;

            if (currentRole === 'teacher' && s.teacherId !== currentUser.teacherId) {
                showToast('您没有权限编辑此学生', 'error');
                return;
            }

            editingStudentId = id;

            var html = '<form onsubmit="saveStudentDetail(event)" class="space-y-6">';

            html += '<div class="form-section">';
            html += '<h3 class="section-title text-lg">基本信息</h3>';
            html += '<div class="grid grid-cols-1 md:grid-cols-4 gap-4">';
            html += '<div><label class="block text-sm font-medium text-gray-700 mb-1">学校</label><input type="text" name="school" value="' + (s.details.school || s.school) + '" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></div>';
            html += '<div><label class="block text-sm font-medium text-gray-700 mb-1">专业</label><input type="text" name="major" value="' + (s.details.major || s.major) + '" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></div>';
            html += '<div><label class="block text-sm font-medium text-gray-700 mb-1">GPA</label><input type="text" name="gpa" value="' + (s.details.gpa || s.gpa) + '" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></div>';
            html += '<div><label class="block text-sm font-medium text-gray-700 mb-1">合同类型</label><select name="contractType" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">';
            contractTypes.forEach(function(ct) {
                html += '<option value="' + ct + '" ' + (s.contractType === ct ? 'selected' : '') + '>' + ct + '</option>';
            });
            html += '</select></div>';
            html += '</div></div>';

            html += '<div class="form-section">';
            html += '<h3 class="section-title text-lg">状态</h3>';
            html += '<select name="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">';
            statuses.forEach(function(st) {
                html += '<option value="' + st + '" ' + (s.status === st ? 'selected' : '') + '>' + st + '</option>';
            });
            html += '</select></div>';

            html += '<div class="flex justify-center gap-4 pt-4 sticky bottom-0 bg-white pb-2">';
            html += '<button type="submit" class="px-8 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:shadow-lg font-medium">保存修改</button>';
            html += '<button type="button" onclick="closeModal()" class="px-8 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 font-medium">取消</button>';
            html += '</div>';
            html += '</form>';

            openModal('编辑学生 - ' + s.name, html);
        }

        function saveStudentDetail(e) {
            e.preventDefault();
            var form = e.target;
            var s = students.find(st => st.id === editingStudentId);
            if (!s) return;

            s.details.school = form.school.value;
            s.details.major = form.major.value;
            s.details.gpa = form.gpa.value;
            s.school = form.school.value;
            s.major = form.major.value;
            s.gpa = form.gpa.value;
            s.contractType = form.contractType.value;
            s.status = form.status.value;
            s.updatedAt = new Date().toISOString().split('T')[0];

            closeModal();
            saveData();
            renderPage();
            showToast('保存成功');
        }

        function showDeleteConfirm(type, id) {
            deleteTarget = { type: type, id: id };
            var name = '';
            if (type === 'teacher') {
                var t = teachers.find(te => te.id === id);
                name = t ? t.name : '';
                document.getElementById('deleteConfirmText').textContent = '确定删除老师 "' + name + '" 吗？';
            } else {
                var s = students.find(st => st.id === id);
                name = s ? s.name : '';
                document.getElementById('deleteConfirmText').textContent = '确定删除学生 "' + name + '" 吗？';
            }
            document.getElementById('deleteConfirmModal').classList.remove('hidden');
        }

        function closeDeleteConfirm() {
            document.getElementById('deleteConfirmModal').classList.add('hidden');
            deleteTarget = { type: null, id: null };
        }

        function confirmDelete() {
            if (!deleteTarget.type || !deleteTarget.id) {
                closeDeleteConfirm();
                return;
            }

            if (deleteTarget.type === 'teacher') {
                var teacherIndex = teachers.findIndex(t => t.id === deleteTarget.id);
                if (teacherIndex > -1) {
                    var teacherName = teachers[teacherIndex].name;
                    students.forEach(s => {
                        if (s.teacherId === deleteTarget.id) {
                            s.teacherId = 1;
                            s.teacherName = teachers[0].name;
                        }
                    });
                    teachers.splice(teacherIndex, 1);
                    users = users.filter(u => !(u.role === 'teacher' && u.teacherId === deleteTarget.id));
                    updateTeacherStats();
                    saveData();
                    showToast('已删除老师 "' + teacherName + '"');
                }
            } else {
                var studentIndex = students.findIndex(s => s.id === deleteTarget.id);
                if (studentIndex > -1) {
                    var studentName = students[studentIndex].name;
                    students.splice(studentIndex, 1);
                    updateTeacherStats();
                    saveData();
                    showToast('已删除学生 "' + studentName + '"');
                }
            }

            closeDeleteConfirm();
            renderPage();
        }

        function openModal(title, content) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modalContainer').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalContainer').classList.add('hidden');
            document.body.style.overflow = 'auto';
            editingStudentId = null;
        }

        function showToast(msg, type) {
            if (!type) type = 'success';
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transform translate-y-0 opacity-100 transition-all duration-300 z-50 font-medium ' + (type === 'error' ? 'bg-red-500' : 'bg-green-500') + ' text-white';
            setTimeout(function() {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteConfirm();
                closeBatchAssign();
                closeExportModal();
                closeTimelinePreview();
                closeBatchDelete();
            }
        });

        // 页面加载完成后确保登录页显示
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginPage').classList.remove('hidden');
        });
    </script>
